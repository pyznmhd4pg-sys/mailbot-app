<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отладка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: monospace; padding: 16px; background: #FDEBD0; color: #3E2723; word-break: break-all; }
        pre { white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
    <h3>Данные из API:</h3>
    <pre id="debug">Загрузка...</pre>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const urlParams = new URLSearchParams(window.location.search);
        const API_URL = urlParams.get('api') || window.location.origin;

        async function test() {
            try {
                // Берем список писем
                const res1 = await fetch(API_URL + "/api/emails", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                const data1 = await res1.json();
                
                if (data1.emails && data1.emails.length > 0) {
                    // Берем первое письмо (в котором ты видел вложение)
                    const firstEmail = data1.emails[0];
                    document.getElementById('debug').innerText = JSON.stringify(firstEmail, null, 2);
                } else {
                    document.getElementById('debug').innerText = "Нет писем.";
                }
            } catch (e) {
                document.getElementById('debug').innerText = "Ошибка: " + e.message;
            }
        }
        
        test();
    </script>
</body>
</html>
