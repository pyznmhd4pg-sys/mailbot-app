<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 16px; background: #FDEBD0; color: #3E2723; }
        #debug { color: red; font-size: 14px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Тест загрузки</h2>
    <div id="debug">Ожидание...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const urlParams = new URLSearchParams(window.location.search);
        const API_URL = urlParams.get('api') || window.location.origin;

        async function test() {
            const debugDiv = document.getElementById('debug');
            debugDiv.innerText = "Отправка запроса...";
            
            try {
                // Отправляем POST запрос на сервер
                const response = await fetch(API_URL + "/api/emails", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                debugDiv.innerText = "Статус ответа: " + response.status;
                
                // Получаем ответ как обычный текст
                const text = await response.text();
                
                // Выводим первые 500 символов ответа на экран
                debugDiv.innerText = "Ответ: " + text.substring(0, 500);
                
            } catch (e) {
                debugDiv.innerText = "ОШИБКА: " + e.message;
            }
        }
        
        test();
    </script>
</body>
</html>
