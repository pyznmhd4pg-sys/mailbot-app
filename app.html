<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя почта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 16px; background: #FDEBD0; color: #3E2723; }
        #debug { color: red; font-size: 14px; font-weight: bold; margin-bottom: 20px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>📥 Входящие</h2>
    <div id="debug"></div>
    <div id="email-list">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Страница берет адрес, на котором она открыта (это ссылка туннеля)
        const API_URL = window.location.origin; 
        document.getElementById('debug').innerText = "Стучимся по адресу: " + API_URL + "/api/emails";

        async function loadEmails() {
            try {
                const response = await fetch(API_URL + "/api/emails", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                const text = await response.text(); // Читаем как текст
                
                document.getElementById('debug').innerText = "Ответ сервера: " + text; // Показываем ответ на экране
                
            } catch (e) {
                document.getElementById('debug').innerText = "ОШИБКА СЕТИ: " + e.message;
            }
        }
        
        loadEmails();
    </script>
</body>
</html>
