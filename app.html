<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест вложений</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 16px; background: #FDEBD0; color: #3E2723; }
        .item { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .green { color: green; font-weight: bold; }
        .red { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Поиск вложений:</h3>
    <div id="debug">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const urlParams = new URLSearchParams(window.location.search);
        const API_URL = urlParams.get('api') || window.location.origin;

        async function test() {
            const debugDiv = document.getElementById('debug');
            try {
                const response = await fetch(API_URL + "/api/emails", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                const data = await response.json();
                debugDiv.innerHTML = "";
                
                if (data.emails && data.emails.length > 0) {
                    data.emails.forEach(em => {
                        // Ищем письмо, в котором есть слово Транзит или СК
                        if (em.subject.includes("Транзит") || em.subject.includes("ТК") || em.subject.includes("документ")) {
                            const div = document.createElement('div');
                            div.className = 'item';
                            
                            const attCount = em.attachments ? em.attachments.length : 0;
                            const attText = attCount > 0 
                                ? `<span class="green">📎 Найдено вложений: ${attCount}!</span><br>${JSON.stringify(em.attachments)}` 
                                : `<span class="red">Вложений нет в этом письме</span>`;
                            
                            div.innerHTML = `<b>Тема: ${em.subject}</b><br>${attText}`;
                            debugDiv.appendChild(div);
                        }
                    });
                    
                    if (debugDiv.innerHTML === "") {
                        debugDiv.innerHTML = "Письмо с темой 'Транзит' не найдено в последних 10 письмах.";
                    }
                } else {
                    debugDiv.innerText = "Писем нет.";
                }
            } catch (e) {
                debugDiv.innerText = "Ошибка: " + e.message;
            }
        }
        
        test();
    </script>
</body>
</html>
