<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отладка списка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 16px; background: #FDEBD0; color: #3E2723; }
        .email-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .error { color: red; }
    </style>
</head>
<body>
    <h3>Список писем:</h3>
    <div id="debug">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const urlParams = new URLSearchParams(window.location.search);
        const API_URL = urlParams.get('api') || window.location.origin;

        async function test() {
            const debugDiv = document.getElementById('debug');
            try {
                const response = await fetch(API_URL + "/api/emails", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                const data = await response.json();
                debugDiv.innerHTML = "";
                
                if (data.emails && data.emails.length > 0) {
                    data.emails.forEach(em => {
                        const div = document.createElement('div');
                        div.className = 'email-item';
                        
                        // Считаем количество вложений
                        const attCount = em.attachments ? em.attachments.length : 0;
                        const attText = attCount > 0 ? `<b style="color:green;">📎 Вложений: ${attCount}</b>` : `<span style="color:gray;">Без вложений</span>`;
                        
                        div.innerHTML = `<b>${em.subject}</b><br>От: ${em.from_name}<br>${attText}`;
                        debugDiv.appendChild(div);
                    });
                } else {
                    debugDiv.innerText = "Писем нет.";
                }
            } catch (e) {
                debugDiv.innerText = "Ошибка: " + e.message;
            }
        }
        
        test();
    </script>
</body>
</html>
