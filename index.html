<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя почта</title>
    <!-- Обязательно подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 16px; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        button { margin-top: 10px; padding: 10px; width: 100%; }
    </style>
</head>
<body>
    <h2>📥 Моя почта</h2>
    <div id="content">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();   // Сообщаем Telegram, что страница готова
        tg.expand();  // Разворачиваем на весь экран

        // Просто показываем данные пользователя для проверки
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('content').innerText = `Привет, ${user.first_name}! Твой ID: ${user.id}`;
        } else {
            document.getElementById('content').innerText = 'Открой меня через Telegram!';
        }
    </script>
</body>
</html>
