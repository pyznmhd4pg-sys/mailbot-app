<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя почта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 16px; 
            background: var(--tg-theme-bg-color); 
            color: var(--tg-theme-text-color); 
        }
        .email { 
            border: 1px solid var(--tg-theme-hint-color); 
            border-radius: 8px; 
            padding: 12px; 
            margin-bottom: 10px; 
            background: var(--tg-theme-secondary-bg-color);
        }
        .email h3 { margin: 0 0 5px 0; font-size: 16px; }
        .email p { margin: 5px 0; font-size: 14px; color: var(--tg-theme-hint-color); }
        .loader { text-align: center; margin-top: 20px; }
        .error { color: red; text-align: center; margin-top: 20px; word-wrap: break-word; }
    </style>
</head>
<body>
    <h2>📥 Входящие</h2>
    <div id="content" class="loader">Загрузка писем...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ⚠️ ВСТАВЬ СЮДА АКТУАЛЬНУЮ ССЫЛКУ ИЗ ОКНА MANAGER
        const API_URL = "https://consolidated-warrior-utilize-publishing.trycloudflare.com"; 

        async function loadEmails() {
            try {
                const response = await fetch(API_URL + "/api/emails", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                // Если сервер вернул ошибку (например, 404 или 500)
                if (!response.ok) {
                    throw new Error(`Сервер вернул статус ${response.status}`);
                }

                const data = await response.json();
                const content = document.getElementById('content');
                content.className = ""; // убираем лоадер
                content.innerHTML = "";

                if (data.error) {
                    content.className = "error";
                    content.innerText = "Ошибка сервера: " + data.error;
                    return;
                }

                if (!data.emails || data.emails.length === 0) {
                    content.innerText = "Писем нет.";
                    return;
                }

                data.emails.forEach(em => {
                    const div = document.createElement('div');
                    div.className = 'email';
                    div.innerHTML = `
                        <h3>${em.subject}</h3>
                        <p><b>От:</b> ${em.from}</p>
                        <p>${em.body}...</p>
                    `;
                    content.appendChild(div);
                });

            } catch (e) {
                // Выводим ошибку прямо на экран
                const content = document.getElementById('content');
                content.className = "error";
                content.innerHTML = `
                    <b>Ошибка сети</b><br>
                    ${e.message}<br><br>
                    <small>Проверь ссылку API: ${API_URL}</small>
                `;
            }
        }

        loadEmails();
    </script>
</body>
</html>
