<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя почта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 16px; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        .email { border: 1px solid var(--tg-theme-hint-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; background: var(--tg-theme-secondary-bg-color); }
        .email h3 { margin: 0 0 5px 0; font-size: 16px; }
        .email p { margin: 5px 0; font-size: 14px; color: var(--tg-theme-hint-color); }
        .btn { display: block; width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); }
        .btn-danger { background: #f44336; color: white; }
        .btn-secondary { background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color); border: 1px solid var(--tg-theme-hint-color); }
        textarea { width: 100%; height: 100px; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--tg-theme-hint-color); background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); box-sizing: border-box; }
        .hidden { display: none; }
        .error { color: red; text-align: center; margin-top: 20px; }
        a { color: var(--tg-theme-link-color); }
    </style>
</head>
<body>
    <!-- ЭКРАН 1: Список писем -->
    <div id="screen-list">
        <h2>📥 Входящие</h2>
        <div id="email-list">Загрузка...</div>
    </div>

    <!-- ЭКРАН 2: Просмотр письма -->
    <div id="screen-view" class="hidden">
        <button class="btn btn-secondary" onclick="showList()">⬅️ Назад</button>
        <h2 id="view-subject" style="margin-top: 15px;"></h2>
        <p><b>От:</b> <span id="view-from"></span></p>
        <p><b>Дата:</b> <span id="view-date"></span></p>
        <div id="view-body" style="margin-top: 15px; white-space: pre-wrap;"></div>
        
        <hr style="margin: 20px 0; border-color: var(--tg-theme-hint-color);">
        
        <textarea id="reply-text" placeholder="Текст ответа..."></textarea>
        <button class="btn btn-primary" onclick="sendReply()">✉️ Отправить ответ</button>
        <button class="btn btn-danger" onclick="deleteEmail()">🗑 Удалить</button>
        <button class="btn btn-secondary" onclick="showMoveMenu()">📂 Переместить</button>
    </div>

    <!-- ЭКРАН 3: Меню перемещения -->
    <div id="screen-move" class="hidden">
        <button class="btn btn-secondary" onclick="showView()">⬅️ Отмена</button>
        <h3>Выбери папку:</h3>
        <div id="folder-list">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ⚠️ ВСТАВЬ СЮДА АКТУАЛЬНУЮ ССЫЛКУ ИЗ ОКНА MANAGER
        const API_URL = "https://eastern-represent-screensavers-replica.trycloudflare.com"; 

        let allEmails = []; 
        let currentEmail = null; 

        async function apiRequest(endpoint, body) {
            const response = await fetch(API_URL + endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData, ...body })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            return data;
        }

        // --- Экран списка ---
        async function loadEmails() {
            const list = document.getElementById('email-list');
            list.innerHTML = "Загрузка...";
            try {
                const data = await apiRequest("/api/emails", {});
                list.innerHTML = "";
                allEmails = data.emails || []; 
                
                if (allEmails.length === 0) {
                    list.innerText = "Писем нет.";
                    return;
                }
                allEmails.forEach(em => {
                    const div = document.createElement('div');
                    div.className = 'email';
                    div.onclick = () => openEmail(em.uid);
                    div.innerHTML = `<h3>${em.subject || "(без темы)"}</h3><p><b>От:</b> ${em.from}</p><p>${(em.body || "").substring(0, 100)}...</p>`;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = `<div class="error">Ошибка: ${e.message}</div>`;
            }
        }

        // --- Открытие письма ---
        function openEmail(uid) {
            const email = allEmails.find(e => String(e.uid) === String(uid));
            if (!email) {
                alert("Письмо не найдено в памяти. Обнови список.");
                return;
            }
            
            currentEmail = email;
            document.getElementById('view-subject').innerText = email.subject || "(без темы)";
            document.getElementById('view-from').innerText = email.from || "Неизвестно";
            document.getElementById('view-date').innerText = email.date || "";
            
            // Превращаем ссылки в кликабельные
            const bodyText = email.body || "Текст письма отсутствует";
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const linkedText = bodyText.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
            document.getElementById('view-body').innerHTML = linkedText;
            
            document.getElementById('reply-text').value = "";
            showView();
        }

        // --- Ответ ---
        async function sendReply() {
            const body = document.getElementById('reply-text').value;
            if (!body) return alert("Введи текст ответа!");
            try {
                await apiRequest("/api/reply", { uid: currentEmail.uid, body: body });
                alert("Ответ отправлен!");
                document.getElementById('reply-text').value = "";
                showList();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        // --- Удаление ---
        async function deleteEmail() {
            if (!confirm("Удалить это письмо?")) return;
            try {
                await apiRequest("/api/delete", { uid: currentEmail.uid, folder: "INBOX" });
                alert("Удалено!");
                showList();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        // --- Перемещение ---
        async function showMoveMenu() {
            try {
                const data = await apiRequest("/api/folders", {});
                const list = document.getElementById('folder-list');
                list.innerHTML = "";
                data.folders.forEach(f => {
                    if (f.toUpperCase() === "INBOX") return;
                    const btn = document.createElement('button');
                    btn.className = "btn btn-secondary";
                    btn.innerText = f;
                    btn.onclick = () => moveEmail(f);
                    list.appendChild(btn);
                });
                showScreen('screen-move');
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        async function moveEmail(dest) {
            try {
                await apiRequest("/api/move", { uid: currentEmail.uid, source: "INBOX", destination: dest });
                alert(`Перемещено в ${dest}`);
                showList();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        // --- Навигация ---
        function showScreen(id) {
            document.querySelectorAll('body > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0, 0);
        }
        function showList() { loadEmails(); showScreen('screen-list'); }
        function showView() { showScreen('screen-view'); }

        loadEmails();
    </script>
</body>
</html>
