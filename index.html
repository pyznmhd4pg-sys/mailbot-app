<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя почта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Песчаный фон с узорами в стиле Telegram */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 16px; 
            margin: 0;
            color: #3E2723; 
            background-color: #FDEBD0;
            /* Градиент + SVG узор */
            background-image: 
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23E8C39E' stroke-width='1.5' stroke-opacity='0.6'%3E%3Cpath d='M60 0L120 60L60 120L0 60Z' /%3E%3Ccircle cx='60' cy='60' r='30' /%3E%3Ccircle cx='0' cy='0' r='20' /%3E%3Ccircle cx='120' cy='0' r='20' /%3E%3Ccircle cx='0' cy='120' r='20' /%3E%3Ccircle cx='120' cy='120' r='20' /%3E%3Cpath d='M0 60L30 30L60 0M60 120L90 90L120 60M0 60L30 90L60 120M60 0L90 30L120 60' /%3E%3C/g%3E%3C/svg%3E"),
                radial-gradient(at 0% 0%, #F5CBA7 0px, transparent 50%),
                radial-gradient(at 100% 0%, #E8C39E 0px, transparent 50%),
                radial-gradient(at 100% 100%, #F5CBA7 0px, transparent 50%),
                radial-gradient(at 0% 100%, #E8C39E 0px, transparent 50%);
            background-attachment: fixed;
            background-size: 200px 200px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
        }

        /* Стили для карточек писем (эффект матового стекла) */
        .email { 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 12px; 
            cursor: pointer; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.1s ease;
        }
        .email:active { transform: scale(0.98); }
        
        .email h3 { margin: 0 0 5px 0; font-size: 16px; color: #3E2723; }
        .email p { margin: 5px 0; font-size: 14px; color: #5D4037; }
        
        /* Кнопки */
        .btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-primary { background: #D35400; color: white; box-shadow: 0 4px 10px rgba(211, 84, 0, 0.3); }
        .btn-danger { background: #E74C3C; color: white; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); }
        .btn-secondary { 
            background: rgba(255, 255, 255, 0.85); 
            color: #3E2723; 
            border: 1px solid rgba(0,0,0,0.1); 
            backdrop-filter: blur(5px);
        }
        
        /* Поле ввода */
        textarea { 
            width: 100%; 
            height: 100px; 
            padding: 12px; 
            margin-top: 10px; 
            border-radius: 12px; 
            border: 1px solid rgba(0,0,0,0.1); 
            background: rgba(255, 255, 255, 0.85); 
            color: #3E2723; 
            box-sizing: border-box; 
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus { outline: 2px solid #D35400; background: rgba(255, 255, 255, 1); }

        .hidden { display: none; }
        .error { color: #C0392B; text-align: center; margin-top: 20px; font-weight: bold; }
        
        #view-body { 
            margin-top: 15px; 
            overflow-wrap: break-word;
            white-space: pre-wrap; 
            font-size: 15px;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        /* Заголовки на экране письма */
        #view-subject { color: #3E2723; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); }
        #screen-view p { color: #5D4037; }
    </style>
</head>
<body>
    <div id="screen-list">
        <h2>📥 Входящие</h2>
        <div id="email-list">Загрузка...</div>
    </div>

    <div id="screen-view" class="hidden">
        <button class="btn btn-secondary" onclick="showList()">⬅️ Назад</button>
        <h2 id="view-subject" style="margin-top: 15px;"></h2>
        <p><b>От:</b> <span id="view-from"></span></p>
        <p><b>Дата:</b> <span id="view-date"></span></p>
        
        <div id="view-body"></div>
        
        <hr style="margin: 20px 0; border-color: rgba(0,0,0,0.1);">
        
        <textarea id="reply-text" placeholder="Текст ответа..."></textarea>
        <button class="btn btn-primary" onclick="sendReply()">✉️ Отправить ответ</button>
        <button class="btn btn-danger" onclick="deleteEmail()">🗑 Удалить</button>
        <button class="btn btn-secondary" onclick="showMoveMenu()">📂 Переместить</button>
    </div>

    <div id="screen-move" class="hidden">
        <button class="btn btn-secondary" onclick="showView()">⬅️ Отмена</button>
        <h3>Выбери папку:</h3>
        <div id="folder-list">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Устанавливаем цвет шапки Telegram под наш фон
        tg.setHeaderColor('#FDEBD0');
        tg.setBackgroundColor('#FDEBD0');

        const API_URL = "https://closely-sunny-variety-mlb.trycloudflare.com"; 

        let allEmails = []; 
        let currentEmail = null; 

        async function apiRequest(endpoint, body) {
            const response = await fetch(API_URL + endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData, ...body })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            return data;
        }

        async function loadEmails() {
            const list = document.getElementById('email-list');
            list.innerHTML = "Загрузка...";
            try {
                const data = await apiRequest("/api/emails", {});
                list.innerHTML = "";
                allEmails = data.emails || []; 
                
                if (allEmails.length === 0) {
                    list.innerText = "Писем нет.";
                    return;
                }
                allEmails.forEach(em => {
                    const div = document.createElement('div');
                    div.className = 'email';
                    div.onclick = () => openEmail(em.uid);
                    const previewText = (em.body || "").substring(0, 100);
                    div.innerHTML = `<h3>${em.subject || "(без темы)"}</h3><p><b>От:</b> ${em.from}</p><p>${previewText}...</p>`;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = `<div class="error">Ошибка: ${e.message}</div>`;
            }
        }

        function openEmail(uid) {
            const email = allEmails.find(e => String(e.uid) === String(uid));
            if (!email) {
                alert("Письмо не найдено в памяти. Обнови список.");
                return;
            }
            
            currentEmail = email;
            document.getElementById('view-subject').innerText = email.subject || "(без темы)";
            document.getElementById('view-from').innerText = email.from || "Неизвестно";
            document.getElementById('view-date').innerText = email.date || "";
            
            let bodyText = email.body || "";
            if (bodyText.trim() === "") {
                bodyText = "(В этом письме нет текста, только картинки или ссылки.)";
            }
            document.getElementById('view-body').textContent = bodyText;
            
            document.getElementById('reply-text').value = "";
            showView();
        }

        async function sendReply() {
            const body = document.getElementById('reply-text').value;
            if (!body) return alert("Введи текст ответа!");
            try {
                await apiRequest("/api/reply", { uid: currentEmail.uid, body: body });
                alert("Ответ отправлен!");
                document.getElementById('reply-text').value = "";
                showList();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        async function deleteEmail() {
            if (!confirm("Удалить это письмо?")) return;
            try {
                await apiRequest("/api/delete", { uid: currentEmail.uid, folder: "INBOX" });
                alert("Удалено!");
                showList();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        async function showMoveMenu() {
            try {
                const data = await apiRequest("/api/folders", {});
                const list = document.getElementById('folder-list');
                list.innerHTML = "";
                data.folders.forEach(f => {
                    if (f.toUpperCase() === "INBOX") return;
                    const btn = document.createElement('button');
                    btn.className = "btn btn-secondary";
                    btn.style.marginTop = "8px";
                    btn.innerText = f;
                    btn.onclick = () => moveEmail(f);
                    list.appendChild(btn);
                });
                showScreen('screen-move');
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        async function moveEmail(dest) {
            try {
                await apiRequest("/api/move", { uid: currentEmail.uid, source: "INBOX", destination: dest });
                alert(`Перемещено в ${dest}`);
                showList();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        function showScreen(id) {
            document.querySelectorAll('body > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0, 0);
        }
        function showList() { loadEmails(); showScreen('screen-list'); }
        function showView() { showScreen('screen-view'); }

        loadEmails();
    </script>
</body>
</html>
